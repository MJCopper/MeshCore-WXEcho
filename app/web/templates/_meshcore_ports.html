{% if devices %}
<label for="meshcore_detected_port">Detected MeshCore companion</label>
<select id="meshcore_detected_port" onchange="if (this.value) document.getElementById('meshcore_port').value = this.value">
  <option value="">Select a USB radio...</option>
  {% for device in devices %}
  <option value="{{ device.port }}" {% if device.port == current_port %}selected{% endif %}>{{ device.model or 'MeshCore device' }}{% if device.firmware %} (firmware {{ device.firmware }}){% endif %} - {{ device.description or 'USB serial device' }} - {{ device.port }}</option>
  {% endfor %}
</select>
{% else %}
<p class="hint">No MeshCore devices responded on the available USB serial ports.</p>
{% endif %}
